api_version: 1
provider: Kumbuka
id: me.kumbuka.mermaid
name: Mermaid
version: 1.9.0
description: Generate cached Mermaid SVGs and opt-in interactive diagrams.
default_enabled: true
modules:
  - type: renderer-extension
    id: fences
    stage: postprocess
    usage:
      - fence: mermaid
  - type: browser-module
    id: diagrams
    javascript: plugin.js
    css: plugin.css
permissions: [browser:render, artifacts:write]
