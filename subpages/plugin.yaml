api_version: 1
provider: Kumbuka
id: me.kumbuka.subpages
name: Subpages
description: Show child pages as generated navigation.
version: 1.3.0
default_enabled: true
modules:
  - type: macro
    id: subpages
    name: subpages
    usage:
      - macro: subpages
  - type: editor-insert
    id: editor
    name: Subpages
    description: Insert child-page navigation.
    markdown: "{{subpages}}"
    group: insert
    allowed_groups: [insert, blocks, plugins]
    order: 60
    icon: list-tree-lucide
permissions: [pages:read]
