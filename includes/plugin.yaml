api_version: 1
provider: Kumbuka
id: me.kumbuka.includes
name: Includes
version: 1.3.1
description: Transclude complete pages or heading sections into Markdown.
default_enabled: true
modules:
  - type: renderer-extension
    id: includes
    stage: content-preprocess
    priority: 100
    capability: pages.content
    usage:
      - substitution: include
  - type: editor-insert
    id: include
    name: Include page
    description: Transclude another page or heading section.
    icon: file-input-lucide
    markdown: "{{include:page/path}}"
    inline: true
    group: insert
    allowed_groups: [insert, plugins]
    order: 50
permissions:
  - pages:content
