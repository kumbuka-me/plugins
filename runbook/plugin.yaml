api_version: 1
provider: Kumbuka
id: me.kumbuka.runbook
name: Runbook
version: 1.2.0
description: Show decisions, actions, and shared handoffs as a compact branch-and-merge graph.
default_enabled: true
modules:
  - type: renderer-extension
    id: fences
    stage: postprocess
    usage:
      - fence: runbook
  - type: browser-module
    id: graph
    javascript: plugin.js
    css: plugin.css
  - type: editor-insert
    id: insert
    name: Runbook
    description: Insert a runbook with editable steps, decisions, and shared destinations.
    icon: git-branch-lucide
    group: insert
    allowed_groups: [insert, blocks, plugins]
    markdown: |
      ```runbook
      start: Receive alert
        -> decision
      decision: Does this need attention?
        Yes -> action
        No -> done
      action: Contact the on-call engineer
        -> done
      done: Finish
      ```
permissions: [browser:render]
