api_version: 1
provider: Kumbuka
id: me.kumbuka.tasks
name: Tasks
icon: square-check-big-lucide
version: 1.3.0
description: Add persistent actionable tasks with assignees, due dates, configurable states, and notifications to Kumbuka pages.
default_enabled: true
modules:
  - type: settings
    id: workflow
    name: Workflow
    description: Configure the ordered states available to tasks. Leave empty to use Open and Done.
    fields:
      - id: states
        name: States
        type: list
        max_bytes: 8192
        max_items: 16
        columns:
          - id: id
            name: ID
            type: text
            required: true
            max_bytes: 64
          - id: label
            name: Label
            type: text
            required: true
            max_bytes: 64
          - id: color
            name: Color
            type: color
            required: true
            default: "#64748b"
          - id: completed
            name: Completed
            type: select
            required: true
            default: "false"
            options:
              - "false"
              - "true"
  - type: renderer-extension
    id: task
    stage: preprocess
    usage:
      - contains: "{{task"
  - type: content-style
    id: style
    css: plugin.css
    usage:
      - contains: "{{task"
  - type: browser-module
    id: task-ui
    javascript: plugin.js
    css: browser.css
  - type: widget
    id: page-details
    surface: page.details
    order: 35
  - type: content-change
    id: assignments
  - type: editor-insert
    id: task-insert
    name: Task
    description: Insert a persistent actionable task.
    markdown: '{{task id="task-id" text="Describe the task"}}'
    inline: false
    group: insert
    allowed_groups: [insert, blocks, plugins]
    order: 85
    icon: square-check-big-lucide
permissions:
  - browser:render
  - settings:read
  - storage:read
  - storage:write
  - pages:content
  - users:read
  - notifications:send
