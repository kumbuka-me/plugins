api_version: 1
provider: Kumbuka
id: me.kumbuka.external-files
name: External Files
icon: file-code-2-lucide
version: 1.7.3
description: Embed GitHub and GitLab files with line ranges, annotations, and revision metadata.
default_enabled: false
modules:
  - type: settings
    id: appearance
    name: Appearance
    description: Default presentation for external-file embeds. Individual macros can override these values.
    fields:
      - id: reference_position
        name: Reference position
        type: select
        required: true
        default: right
        options:
          - right
          - left
      - id: reference_color
        name: Reference color
        type: select
        required: true
        default: accent
        options:
          - accent
          - blue
          - green
          - yellow
          - orange
          - red
          - purple
          - gray
      - id: highlight_referenced_lines
        name: Highlight referenced lines
        type: boolean
        default: "true"
      - id: show_line_numbers
        name: Show line numbers
        type: boolean
        default: "true"
      - id: show_provider
        name: Show provider
        type: boolean
        default: "true"
      - id: show_branch
        name: Show branch, tag, or commit
        type: boolean
        default: "true"
  - type: settings
    id: cache
    name: Cache
    description: Cache external files and lazily refresh stale content when a page is visited.
    fields:
      - id: ttl
        name: Cache TTL
        type: select
        required: true
        default: 1h
        options:
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 6h
          - 12h
          - 24h
  - type: admin-action
    id: refresh-cache
    name: Refresh cache
    description: Mark all cached external files stale. Each file is fetched again the next time it is viewed.
    icon: refresh-cw-lucide
  - type: admin-resource
    id: sources
    name: Sources
    description: Repository connections available to external-file macros.
    fields:
      - id: name
        name: Name
        type: text
        required: true
        key: true
        max_bytes: 128
      - id: provider
        name: Provider
        type: select
        required: true
        default: github
        options:
          - github
          - gitlab
      - id: endpoint
        name: API endpoint
        type: url
        required: true
        max_bytes: 512
      - id: repository
        name: Repository
        type: text
        required: true
        max_bytes: 256
      - id: ref
        name: Branch, tag, or commit
        type: text
        required: true
        max_bytes: 256
      - id: private_ips
        name: Allowed private IPs
        type: textarea
        max_bytes: 2048
      - id: token
        name: Access token
        type: secret
        max_bytes: 4096
      - id: insecure_skip_verify
        name: Skip TLS certificate verification
        type: boolean
        default: "false"
      - id: enabled
        name: Enabled
        type: boolean
        default: "true"
  - type: macro
    id: external-files
    name: external-file
    usage:
      - macro: external-file
  - type: content-style
    id: style
    css: plugin.css
    usage:
      - macro: external-file
  - type: editor-insert
    id: editor
    name: External file
    description: Display a file from a configured source.
    icon: file-code-2-lucide
    markdown: '{{external-file source="engineering" path="README.md" lines="1-10" note="3:Explain this line here."}}'
    group: insert
    allowed_groups: [insert, plugins]
    order: 90
permissions:
  - settings:read
  - network:http
  - network:private
  - network:insecure-tls
