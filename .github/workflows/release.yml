---
name: Release plugin

on:
  push:
    tags:
      - "*/v*"

  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin name
        required: true
        type: string
      version:
        description: Plugin version without v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLUGIN: ${{ inputs.plugin }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            plugin="$INPUT_PLUGIN"
            version="$INPUT_VERSION"
            tag="$plugin/v$version"
          else
            tag="$REF_NAME"
            plugin="${tag%%/v*}"
            version="${tag#*/v}"
          fi

          if [[ -z "$plugin" || -z "$version" ]]; then
            echo "Unable to resolve plugin release" >&2
            exit 1
          fi

          if [[ ! "$plugin" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid plugin name: $plugin" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi

          if [[ "$tag" != "$plugin/v$version" ]]; then
            echo "Invalid plugin tag: $tag" >&2
            exit 1
          fi

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate release
        shell: bash
        env:
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PLUGIN/plugin.yaml" ]]; then
            echo "Unknown plugin: $PLUGIN" >&2
            exit 1
          fi

          manifest_version="$(./scripts/plugin-version.sh "$PLUGIN")"

          if [[ "$VERSION" != "$manifest_version" ]]; then
            echo "Tag version $VERSION does not match $PLUGIN/plugin.yaml ($manifest_version)" >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build plugin
        env:
          PLUGIN: ${{ steps.release.outputs.plugin }}
        run: make build-plugin PLUGIN="$PLUGIN"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          artifact="dist/$PLUGIN-$VERSION.kumbukaplugin"
          checksum="$artifact.sha256"

          if [[ ! -f "$artifact" ]]; then
            echo "Missing artifact: $artifact" >&2
            exit 1
          fi

          if [[ ! -f "$checksum" ]]; then
            echo "Missing checksum: $checksum" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading artifacts"

            gh release upload \
              "$TAG" \
              "$artifact" \
              "$checksum" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$artifact" \
              "$checksum" \
              --verify-tag \
              --title "$PLUGIN v$VERSION" \
              --notes "Kumbuka $PLUGIN plugin v$VERSION."
          fi
