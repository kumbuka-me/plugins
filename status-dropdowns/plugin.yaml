api_version: 1
provider: Kumbuka
id: me.kumbuka.status-dropdowns
name: Status Dropdowns
icon: list-checks-lucide
version: 1.6.2
description: Interactive inline status dropdowns with page-local or reusable choices and persistent values.
default_enabled: true
modules:
  - type: admin-resource
    id: sets
    name: Status sets
    description: Reusable status choices shared across pages.
    fields:
      - id: name
        name: Name
        type: text
        required: true
        key: true
        max_bytes: 128
      - id: description
        name: Description
        type: text
        max_bytes: 1024
      - id: statuses
        name: Statuses
        type: list
        required: true
        max_bytes: 4096
        max_items: 16
        columns:
          - id: label
            name: Status
            type: text
            required: true
            max_bytes: 64
          - id: color
            name: Color
            type: color
            required: true
            default: "#64748b"
  - type: renderer-extension
    id: status
    stage: preprocess
    usage:
      - contains: "{{status"
  - type: content-style
    id: style
    css: plugin.css
    usage:
      - contains: "{{status"
  - type: browser-module
    id: status-ui
    javascript: plugin.js
    css: browser.css
  - type: widget
    id: page-details
    surface: page.details
    order: 30
  - type: editor-insert
    id: status-insert
    name: Status
    description: Insert a persistent page-local status dropdown.
    markdown: '{{status id="release-readiness" options="To do;In progress;Blocked;Done" prefix="Release"}}'
    inline: true
    group: insert
    allowed_groups: [insert, plugins]
    order: 80
    icon: list-checks-lucide
permissions:
  - browser:render
  - settings:read
  - storage:read
  - storage:write
  - pages:content
