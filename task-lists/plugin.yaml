api_version: 1
provider: Kumbuka
id: me.kumbuka.task-lists
name: Checklists
icon: list-checks-lucide
version: 1.3.1
description: Add lightweight, interactive Markdown checklists to Kumbuka pages.
default_enabled: true
modules:
  - type: markdown-syntax
    id: grammar
    syntax: task-list
    usage:
      - contains: "[ ]"
      - contains: "[x]"
      - contains: "[X]"
  - type: renderer-extension
    id: presentation
    stage: postprocess
    usage:
      - contains: "[ ]"
      - contains: "[x]"
      - contains: "[X]"
  - type: content-style
    id: presentation-style
    css: plugin.css
    usage:
      - contains: "[ ]"
      - contains: "[x]"
      - contains: "[X]"
  - type: browser-module
    id: checklist-ui
    javascript: plugin.js
    css: browser.css
  - type: widget
    id: commands
    surface: page.after-content
    order: 1000
  - type: editor-insert
    id: editor
    name: Checklist
    description: Prefix selected lines with interactive checklist markers.
    markdown: "- [ ] "
    placeholder: task
    mode: prefix-lines
    group: blocks
    allowed_groups: [blocks, insert]
    order: 20
    icon: list-checks-lucide
permissions:
  - browser:render
  - pages:content
  - pages:write
