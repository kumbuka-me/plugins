api_version: 1
provider: Kumbuka
id: me.kumbuka.snippets
name: Snippets
icon: braces-lucide
version: 1.0.8
description: Reusable Markdown blocks with editor completion.
default_enabled: true
modules:
  - type: admin-resource
    id: snippets
    name: Snippets
    description: Reusable Markdown blocks available to pages.
    fields:
      - id: name
        name: Name
        type: text
        required: true
        key: true
        max_bytes: 128
      - id: description
        name: Description
        type: text
        max_bytes: 4096
      - id: content
        name: Markdown
        type: textarea
        required: true
        max_bytes: 49152
  - type: content-substitution
    id: content
    resource: snippets
    prefix: snippet
    value_field: content
    label_field: name
    detail_field: description
    priority: 200
  - type: editor-completion
    id: completion
    resource: snippets
    trigger: "{{"
    replacement: "{{snippet:${name}}}"
    label_field: name
    detail_field: description
permissions: []
