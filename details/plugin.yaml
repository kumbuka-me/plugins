api_version: 1
provider: Kumbuka
id: me.kumbuka.details
name: Collapsible Details
version: 1.3.1
description: Render collapsible Markdown detail blocks with optional open state.
default_enabled: true
modules:
  - type: renderer-extension
    id: details
    stage: preprocess
    usage:
      - contains: "???"
  - type: editor-insert
    id: editor
    name: Collapsible details
    description: Insert a collapsible details block.
    markdown: "??? \"Details\"\n\n    Hidden details."
    group: insert
    allowed_groups: [insert, blocks, plugins]
    order: 70
    icon: list-collapse-lucide
permissions: []
