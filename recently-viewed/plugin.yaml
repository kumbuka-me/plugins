api_version: 1
provider: Kumbuka
id: me.kumbuka.recently-viewed
name: Recently Viewed
version: 1.1.1
description: Show pages recently viewed by the current user on Home and in the sidebar.
default_enabled: true
modules:
  - type: widget
    id: home
    surface: home
    width: wide
    order: 50
  - type: widget
    id: sidebar
    surface: sidebar
    order: 20
permissions:
  - activity:read
